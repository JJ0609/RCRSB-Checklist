<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
(function(){
  try{
    var t = localStorage.getItem('pd_theme');
    if(t === 'light' || t === 'dark'){ document.documentElement.setAttribute('data-theme', t); }
  }catch(e){}
})();
</script>
<title>Login — Power Design Commissioning</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
html,body{height:100%;}
.app{min-height:100vh;display:flex;flex-direction:column;}
.admin-wrap{padding:16px;flex:1;display:flex;align-items:center;justify-content:center;}
.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px;}
.admin-card h2{font-size:15px;margin:0 0 12px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
.field input[type=text],.field input[type=email],.field input[type=password]{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;
  background:var(--surface);color:var(--ink);
}
.status-msg{font-size:13px;margin-top:10px;padding:8px 10px;border-radius:8px;}
.status-msg.err{background:var(--fail-bg);color:var(--fail);}
.status-msg.ok{background:var(--pass-bg);color:var(--pass);}
.status-msg.info{background:var(--pending-bg);color:var(--ink-soft);}
#gate{max-width:340px;width:100%;text-align:center;margin:0;}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-row">
      <img class="logo-mark logo-for-light" src="power-design-logo-black.png" alt="Power Design">
      <img class="logo-mark logo-for-dark" src="power-design-logo-white.png" alt="Power Design">
      <div class="topbar-titles">
        <div class="proj">Login</div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light/dark mode"></button>
    </div>
  </div>

  <div class="content admin-wrap" id="content">
    <div id="gate" class="admin-card">
      <h2>Account Login</h2>
      <div class="field">
        <input type="email" id="emailInput" placeholder="Enter email address" autocomplete="email">
      </div>
      <button class="btn primary" id="emailSubmit" style="width:100%;">Login</button>
      <div id="loginMsg"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="theme.js"></script>
<script src="login.js"></script>
</body>
</html>
