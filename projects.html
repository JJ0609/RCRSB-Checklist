<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
(function(){
  try{
    var t = localStorage.getItem('pd_theme');
    if(t === 'light' || t === 'dark'){ document.documentElement.setAttribute('data-theme', t); }
  }catch(e){}
})();
</script>

<script>
// Mandatory login gate - no page here is reachable without an email on file.
// No real security (no password needed), but every action needs a real
// identity attached, and the project picker needs to know whos asking.
(function(){
  try{
    if(!localStorage.getItem('pd_user_email')){
      var here = window.location.pathname.split('/').pop() + window.location.search;
      window.location.replace('login.html?redirect=' + encodeURIComponent(here));
    }
  }catch(e){}
})();
</script>
<title>Projects — Power Design Commissioning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-row">
      <img class="logo-mark logo-for-light" src="power-design-logo-black.png" alt="Power Design">
      <img class="logo-mark logo-for-dark" src="power-design-logo-white.png" alt="Power Design">
      <div class="topbar-titles">
        <div class="proj">Systems Commissioning</div>
        <div class="sub">Choose a project &middot; <a class="projects-link" href="admin.html">Admin</a></div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light/dark mode"></button>
    </div>
    <div class="searchwrap">
      <input class="searchbox" id="searchInput" type="text" placeholder="Search projects&hellip;">
    </div>
    <div class="punch-toolbar">
      <select id="regionFilter"><option value="">All Regions</option></select>
    </div>
  </div>

  <div class="content" id="content"></div>
</div>

<script src="config.js"></script>
<script src="theme.js"></script>
<script src="projects.js"></script>
</body>
</html>
