<script>
(function(){
  try{
    var t = localStorage.getItem('pd_theme');
    if(t === 'light' || t === 'dark'){ document.documentElement.setAttribute('data-theme', t); }
  }catch(e){}
})();
</script>

<script>
// Mandatory login gate - no page here is reachable without an email on file.
// No real security (no password needed), but every action needs a real
// identity attached, and the project picker needs to know whos asking.
(function(){
  try{
    // A complete login is an email AND a chosen side (AV/LC), an email
    // alone (e.g. a session from before sides existed) goes back to login.
    if(!sessionStorage.getItem('pd_user_email') || !sessionStorage.getItem('pd_device_type')){
      var here = window.location.pathname.split('/').pop() + window.location.search;
      window.location.replace('login.html?redirect=' + encodeURIComponent(here));
    }
  }catch(e){}
})();
</script>
<title>Projects - Power Design Commissioning</title>
<link rel="stylesheet" href="fonts.css">

<div class="app" id="app">

         <div class="sub">Choose a project &middot; <a class="projects-link" href="admin.html">Admin</a> &middot; <a class="projects-link" href="#" id="switchSideLink">Switch Side</a> &middot; <a class="projects-link" href="#" id="logoutLink">Log out</a></a></div>

</div>
