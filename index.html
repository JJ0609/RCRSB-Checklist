<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
// Applied before stylesheets load so there's no flash of the wrong theme.
// This is the one thing intentionally inlined rather than split into
// app.js — it has to run before first paint, so it can't wait for an
// external file to load.
(function(){
  try{
    var t = localStorage.getItem('pd_theme');
    if(t === 'light' || t === 'dark'){ document.documentElement.setAttribute('data-theme', t); }
  }catch(e){}
})();
</script>
<title>RCRSB Commissioning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-row">
      <img class="logo-mark logo-for-light" src="power-design-logo-black.png" alt="Power Design">
      <img class="logo-mark logo-for-dark" src="power-design-logo-white.png" alt="Power Design">
      <div class="topbar-titles">
        <div class="proj" id="projTitle">Systems Commissioning</div>
        <div class="sub"><a class="projects-link" href="projects.html">&larr; All Projects</a> &middot; <span id="projSub">Loading&hellip;</span></div>
      </div>
      <button class="tech-chip" id="techChip" type="button">Set your name</button>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light/dark mode"></button>
    </div>
    <div class="stats-row">
      <div class="stat">
        <div class="num" id="statTested">0/0</div>
        <div class="lbl">DEVICES TESTED</div>
        <div class="progress-track"><div class="progress-fill" id="statBar" style="width:0%"></div></div>
      </div>
      <div class="stat warn clickable" id="statOpenCard" role="button" tabindex="0">
        <div class="num" id="statOpen">0</div>
        <div class="lbl">OPEN PUNCH ITEMS</div>
      </div>
      <div class="stat accent clickable" id="statFailCard" role="button" tabindex="0">
        <div class="num" id="statFail">0</div>
        <div class="lbl">FAILED CHECKS</div>
      </div>
    </div>
    <div class="searchwrap">
      <input class="searchbox" id="searchInput" type="text" placeholder="Here is a brand new change&hellip;">
    </div>
    <div class="tabs">
      <button class="tab active" id="tabLocations" type="button">By Location</button>
      <button class="tab" id="tabPunch" type="button">Punch List</button>
    </div>
  </div>

  <div class="content" id="content"></div>
</div>

<script src="config.js"></script>
<script src="theme.js"></script>
<script src="app.js"></script>
</body>
</html>
